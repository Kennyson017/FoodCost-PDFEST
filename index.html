<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodCost</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">🍔</span>
                <span class="logo-text">FoodCost</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="#dashboard" class="nav-item active" data-route="dashboard">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Dashboard</span>
            </a>
            <a href="#insumos" class="nav-item" data-route="insumos">
                <span class="nav-icon">🥩</span>
                <span class="nav-label">Insumos</span>
            </a>
            <a href="#produtos" class="nav-item" data-route="produtos">
                <span class="nav-icon">🍔</span>
                <span class="nav-label">Produtos</span>
            </a>
            <a href="#negocio" class="nav-item" data-route="negocio">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">Negócio</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <div id="app" class="app-container">
            <!-- Conteúdo injetado via JS -->
        </div>
    </main>

    <div id="toast-container" class="toast-container"></div>
    <div id="modal-container" class="modal-container hidden"></div>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>

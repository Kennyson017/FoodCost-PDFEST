<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodCost</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f59e0b">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <svg viewBox="0 0 160 40" width="160" height="40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Burger Icon scaled and positioned -->
                    <g transform="translate(0, -10) scale(0.6)">
                        <rect x="0" y="18" width="48" height="13" rx="6.5" fill="var(--text-main)"/>
                        <circle cx="14" cy="24" r="2" fill="var(--bg-card)" opacity="0.6"/>
                        <circle cx="26" cy="21" r="1.8" fill="var(--bg-card)" opacity="0.6"/>
                        <circle cx="37" cy="25" r="1.8" fill="var(--bg-card)" opacity="0.6"/>
                        <rect x="0" y="33" width="48" height="6" rx="1.5" fill="#16a34a"/>
                        <rect x="0" y="41" width="48" height="9" rx="2" fill="var(--bg-hover)"/>
                        <rect x="-2" y="51" width="52" height="5" rx="1" fill="var(--primary)"/>
                        <rect x="0" y="57" width="48" height="11" rx="5.5" fill="var(--text-main)"/>
                    </g>
                    <!-- Text aligned next to the icon -->
                    <text x="36" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="28px" font-weight="700" fill="var(--text-main)" letter-spacing="-0.5px">Food<tspan fill="var(--primary)">Cost</tspan></text>
                </svg>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="#dashboard" class="nav-item active" data-route="dashboard">
                <span class="nav-icon"><i data-lucide="layout-dashboard" style="width: 18px; height: 18px;"></i></span>
                <span class="nav-label">Dashboard</span>
            </a>
            <a href="#insumos" class="nav-item" data-route="insumos">
                <span class="nav-icon"><i data-lucide="beef" style="width: 18px; height: 18px;"></i></span>
                <span class="nav-label">Insumos</span>
            </a>
            <a href="#preparos" class="nav-item" data-route="preparos">
                <span class="nav-icon"><i data-lucide="chef-hat" style="width: 18px; height: 18px;"></i></span>
                <span class="nav-label">Preparos</span>
            </a>
            <a href="#produtos" class="nav-item" data-route="produtos">
                <span class="nav-icon"><i data-lucide="utensils" style="width: 18px; height: 18px;"></i></span>
                <span class="nav-label">Produtos</span>
            </a>
            <a href="#negocio" class="nav-item" data-route="negocio">
                <span class="nav-icon"><i data-lucide="settings" style="width: 18px; height: 18px;"></i></span>
                <span class="nav-label">Negócio</span>
            </a>
        </nav>
        <div style="margin-top: auto; padding: 24px 12px;">
            <button id="themeToggleBtn" class="btn btn-secondary" style="width: 100%; justify-content: flex-start; border: none; padding: 12px 16px;">
                <span class="nav-icon" id="themeIcon"></span>
                <span class="nav-label" id="themeLabel">Modo Claro</span>
            </button>
        </div>
    </aside>

    <main class="main-content">
        <div id="app" class="app-container">
            <!-- Conteúdo injetado via JS -->
        </div>
    </main>

    <div id="toast-container" class="toast-container"></div>
    <div id="modal-container" class="modal-container hidden"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script type="module" src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('SW registered: ', registration);
                }).catch(registrationError => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }
    </script>
</body>
</html>
